# Pinned toolchain and tools (fleetlint repo/dev-environment). `mise install`
# (`make tools`) gives every machine and CI the same versions; CI installs
# them with jdx/mise-action from this file. Renovate updates the pins.
# Keep go and node in step with the Dockerfile's base images
# (scripts/check-toolchain.sh, part of `make lint`, enforces it).
[tools]
go = "1.27.4"
node = "26.13.0"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
"go:github.com/vladopajic/go-test-coverage/v2" = "2.21.0"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "0.6.0"
gitleaks = "8.30.1"
actionlint = "1.7.12"
zizmor = "1.32.0"
shellcheck = "0.11.0"
pinact = "5.0.2"
prek = "0.5.10"
git-cliff = "2.14.2"
resvg = "0.49.0" # make icons: renders frontend/static/favicon.svg into the PNG/ICO set
"github:fleetlint/fleetlint" = "0.6.1"
