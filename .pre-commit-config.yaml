# Git hooks, run by prek (`prek install`; fleetlint hooks/config-present). The
# `builtin` hooks are prek's own and need no download (pre-commit itself does
# not know them); the tool hooks call the binaries mise.toml pins (`make
# tools`). Commit messages are Conventional Commits (cliff.toml turns them
# into the changelog); the full `make check` runs before a push.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # Hygiene (prek built-ins, offline). Fixtures and the built UI are excluded:
  # they must stay byte-exact.
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: &generated ^(internal/webui/dist/|.*/testdata/)
      - id: end-of-file-fixer
        exclude: *generated
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *generated
      - id: fix-byte-order-marker
        exclude: *generated
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: *generated
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
        exclude: *generated
      - id: no-commit-to-branch
        args: [--branch, main]

  # Conventional commit messages
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0 # `prek update` bumps this
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, refactor, perf, test, docs, build, ci, style, chore, revert]

  # Tools pinned in mise.toml
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --no-banner --redact
        language: system
        pass_filenames: false
      - id: fleetlint
        name: fleetlint (repository setup)
        entry: fleetlint check --fail-on error --color=false
        language: system
        pass_filenames: false
        always_run: true
      - id: golangci-fmt
        name: golangci-lint fmt
        entry: golangci-lint fmt
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint (new issues only)
        entry: golangci-lint run --new-from-rev=HEAD --fix
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy is clean
        entry: go mod tidy -diff
        language: system
        files: ^go\.(mod|sum)$
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: zizmor --offline --min-severity medium
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: prettier-frontend
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx --no-install prettier --write --ignore-unknown "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(js|mjs|cjs|svelte|css|json|md|ya?ml)$
        exclude: ^frontend/package-lock\.json$
      - id: eslint-frontend
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx --no-install eslint --fix --max-warnings=0 "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(js|mjs|cjs|svelte)$

  # Full gate before push (the task runner's `check` target)
  - repo: local
    hooks:
      - id: check
        name: full check (lint, tests, coverage, audit, build)
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
