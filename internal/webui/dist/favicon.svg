<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Archivist's mark, and the master of every icon (`make icons` renders the
       PNG/ICO set beside it). A card-catalogue drawer whose cards stand at
       different heights, so it reads as an archive and as the timeline's
       histogram; the tallest card is the "kicker" mint. Shapes sit on even
       coordinates so they land on whole pixels at 32 px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3256"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80b4ff"/>
      <stop offset="1" stop-color="#5a94f2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
  <g id="mark">
    <rect x="10" y="22" width="12" height="20" rx="2.5" fill="#e7ecf3"/>
    <rect x="26" y="8" width="12" height="34" rx="2.5" fill="#7ee0b8"/>
    <rect x="42" y="16" width="12" height="26" rx="2.5" fill="#e7ecf3"/>
    <rect x="8" y="32" width="48" height="24" rx="4" fill="url(#front)"/>
    <rect x="25" y="42" width="14" height="4" rx="2" fill="#1e3256"/>
  </g>
</svg>
