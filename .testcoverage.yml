# go-test-coverage (fleetlint quality/coverage-threshold/go): `make cover`
# writes cover.out and fails when the total drops below the floor. The floor
# sits a few points under the measured value at adoption (83.9 %); raise it,
# never lower it.
profile: cover.out
local-prefix: github.com/johnnycube/archivist
threshold:
  total: 80
