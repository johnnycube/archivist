# Publish the container image (linux/amd64 + linux/arm64) to the forge's
# registry: ghcr.io on GitHub, the Gitea registry on Gitea (both forges read
# this file).
#
# Trigger: a version tag (`git tag -s v1.2.3 && git push --tags`) or the Run
# button. Tags pushed: sha-<12 hex> always; the version and `latest` for a
# tag; the branch name for a manual run. deploy/deploy.sh pulls one of them.
# The image carries an SBOM and build provenance (BuildKit attestations) and
# is signed with cosign.
#
# GitHub needs no setup: the registry is ghcr.io, the login is the workflow's
# GITHUB_TOKEN (packages: write), and the image is signed keyless (GitHub's
# OIDC token, Sigstore). Make the package public once, in its settings.
#
# Gitea needs, in the repository (or organisation) settings:
#   variable REGISTRY               the registry's public host (e.g.
#                                   git.example.com). Not derived from
#                                   github.server_url: on a self-hosted runner
#                                   that is Gitea's cluster-internal address.
#   secrets REGISTRY_USER / REGISTRY_TOKEN
#                                   an account and a token with package
#                                   read/write (DOCKER_REGISTRY_GITEA_USER /
#                                   _TOKEN, the older names, are read too).
#   secrets COSIGN_PRIVATE_KEY / COSIGN_PASSWORD
#                                   `cosign generate-key-pair` output; commit
#                                   cosign.pub for `cosign verify`. Without a
#                                   key and without OIDC the image is pushed
#                                   unsigned, and the release says so.
#   runner env BUILDKIT_HOST        a remote BuildKit (tcp://host:port) when
#                                   the runner's jobs have no Docker daemon;
#                                   unset = a local BuildKit container.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The registry's public host: the REGISTRY variable, else ghcr.io on GitHub.
  REGISTRY: ${{ vars.REGISTRY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-pushed image

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing on GitHub; ignored on Gitea
    # No `image` output: it contains the repository owner, which on Gitea is
    # also the registry login secret, and an output that matches a secret is
    # dropped ("ignore output because it may contain a secret"). The notes
    # job rebuilds the name from the registry and github.repository instead.
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name, tags and version
        id: meta
        shell: bash
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          registry="${REGISTRY:-}"
          if [ -z "$registry" ]; then
            if [ "$SERVER_URL" != "https://github.com" ]; then
              echo "::error::set the repository variable REGISTRY to the registry's public host (see the header of this file)"
              exit 1
            fi
            registry="ghcr.io"
          fi
          image="${registry}/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          names="sha-${SHA:0:12}"
          if [ "$REF_TYPE" = "tag" ]; then
            names="$names ${REF_NAME#v} latest"
            version="${REF_NAME#v}"
          else
            names="$names $(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-\n' '-')"
            version="${REF_NAME}-${SHA:0:12}"
          fi
          {
            echo "registry=$registry"
            echo "image=$image"
            echo "version=$version"
            echo "tags<<END"
            for n in $names; do echo "$image:$n"; done
            echo "END"
          } >> "$GITHUB_OUTPUT"

      # Gitea: the BuildKit the runner names in BUILDKIT_HOST (its jobs are
      # Kubernetes pods without a Docker daemon). GitHub: a local BuildKit
      # container.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ env.BUILDKIT_HOST && 'remote' || 'docker-container' }}
          endpoint: ${{ env.BUILDKIT_HOST }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.REGISTRY_USER || secrets.DOCKER_REGISTRY_GITEA_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.DOCKER_REGISTRY_GITEA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push (with SBOM and provenance attestations)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Cross-compiled (see the Dockerfile): no emulation needed.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
          # No build cache: a release build starts clean (cache poisoning), and
          # a Gitea runner has no cache service anyway.

      # cosign-installer v4 substitutes its install-dir with envsubst (gettext),
      # which GitHub's runner image ships and Gitea's does not.
      - name: envsubst for cosign-installer
        shell: bash
        run: |
          set -euo pipefail
          command -v envsubst >/dev/null && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gettext-base
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        id: sign
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
            echo "signed=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            cosign sign --yes "$IMAGE@$DIGEST"   # keyless: GitHub OIDC + Sigstore
            echo "signed=keyless" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::image NOT signed: set the COSIGN_PRIVATE_KEY and COSIGN_PASSWORD secrets (see the header of this file)"
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed $IMAGE@$DIGEST"

  # Release notes from the commit history (git-cliff, cliff.toml), attached to
  # a release on the forge; GitHub and Gitea share this API shape.
  notes:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs the tags and history
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: false # release pipeline: nothing restored from a cache
      - name: Create the release with generated notes
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_HOST: ${{ needs.image.outputs.registry }}
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          SIGNED: ${{ needs.image.outputs.signed }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          image="${REGISTRY_HOST}/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          git-cliff --latest --strip header -o notes.md
          bt=$(printf '\x60')   # a backtick, for Markdown code spans
          {
            printf '\n**Image:** %s%s:%s%s (%s%s%s), linux/amd64 and linux/arm64, ' "$bt" "$image" "$VERSION" "$bt" "$bt" "$DIGEST" "$bt"
            case "$SIGNED" in
              keyless)
                printf 'signed with cosign (keyless). Verify:\n\n%s%s%s\n' "$bt" "$bt" "$bt"
                printf 'cosign verify %s:%s \\\n  --certificate-identity-regexp %s \\\n  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n' \
                  "$image" "$VERSION" "'^${SERVER_URL}/${REPOSITORY}/\.github/workflows/release\.yml@'"
                printf '%s%s%s\n' "$bt" "$bt" "$bt" ;;
              key)
                printf 'signed with cosign. Verify: %scosign verify --key cosign.pub %s:%s%s\n' "$bt" "$image" "$VERSION" "$bt" ;;
              *)
                printf 'not signed.\n' ;;
            esac
          } >> notes.md
          jq -n --arg tag "$TAG" --rawfile body notes.md '{tag_name: $tag, name: $tag, body: $body, draft: false, prerelease: false}' > release.json
          curl -fsS -X POST "$API_URL/repos/$REPOSITORY/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            --data-binary @release.json -o /dev/null
          echo "release $TAG created"
